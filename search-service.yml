server:
  port: 9099

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

spring:

  datasource:
    url: jdbc:mariadb://localhost:3307/search_db
    username: root
    password: rajni

  elasticsearch:
    uris: http://localhost:9200

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: search-service-groups
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ecommerce.searchservice.DTO.ProductCreatedEvent

  ai:
    mcp:
      server:
        enabled: true
        protocol: SSE
        
        name: ecommerce-search-mcp
        version: 1.0.0
        type: SYNC
        request-timeout: 30s

        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
