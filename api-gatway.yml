server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:

            # =============================
            # AUTH SERVICE
            # =============================
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 5
                    key-resolver: "#{@smartKeyResolver}"

            - id: auth-docs
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/v3/api-docs

            # =============================
            # PROFILE SERVICE
            # =============================
            - id: profile-service
              uri: lb://PROFILE-SERVICE
              predicates:
                - Path=/profile/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@smartKeyResolver}"

            - id: profile-docs
              uri: lb://PROFILE-SERVICE
              predicates:
                - Path=/profile/v3/api-docs

            # =============================
            # PRODUCT SERVICE
            # =============================
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/product/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 15
                    redis-rate-limiter.burstCapacity: 30
                    key-resolver: "#{@smartKeyResolver}"

            - id: product-docs
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/product/v3/api-docs

            # =============================
            # SEARCH SERVICE
            # =============================
            - id: search-service
              uri: lb://SEARCH-SERVICE
              predicates:
                - Path=/search/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@smartKeyResolver}"

            - id: search-docs
              uri: lb://SEARCH-SERVICE
              predicates:
                - Path=/search/v3/api-docs

            # =============================
            # CART SERVICE
            # =============================
            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/cart/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 8
                    redis-rate-limiter.burstCapacity: 15
                    key-resolver: "#{@smartKeyResolver}"

            - id: cart-docs
              uri: lb://CART-SERVICE
              predicates:
                - Path=/cart/v3/api-docs

            # =============================
            # INVENTORY SERVICE
            # =============================
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/inventory/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@smartKeyResolver}"

            - id: inventory-docs
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/inventory/v3/api-docs

            # =============================
            # ORDER SERVICE
            # =============================
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/order/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@smartKeyResolver}"

            - id: order-docs
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/order/v3/api-docs

            # =============================
            # PAYMENT SERVICE
            # =============================
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payment/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 6
                    key-resolver: "#{@smartKeyResolver}"

            - id: payment-docs
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payment/v3/api-docs

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

    urls:
      - name: auth-service
        url: /auth/v3/api-docs

      - name: profile-service
        url: /profile/v3/api-docs

      - name: product-service
        url: /product/v3/api-docs

      - name: search-service
        url: /search/v3/api-docs

      - name: cart-service
        url: /cart/v3/api-docs

      - name: inventory-service
        url: /inventory/v3/api-docs

      - name: order-service
        url: /order/v3/api-docs

      - name: payment-service
        url: /payment/v3/api-docs

logging:
  level:
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
    org.springframework.security: INFO
