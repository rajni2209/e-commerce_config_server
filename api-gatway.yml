server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVER
          predicates:
            - Path=/auth/**

        - id: profile-service
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/profile/**
        
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/product/**
            
        - id: search-service
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/search/**

# if needed u can remove this line but u need to update in the ide also - just for rember purpose
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: my-super-secret-key-my-super-secret-key

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
