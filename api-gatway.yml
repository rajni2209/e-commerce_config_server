server:
  port: 8080

spring:
  application:
    name: api-gatway

  cloud:
    gateway:
      server:
        webflux:

          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          # ===== DEFAULT RATE LIMIT (applies to all routes) =====
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@smartKeyResolver}"

          # ================= ROUTES =================
          routes:

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 5
                    key-resolver: "#{@smartKeyResolver}"

            - id: profile-service
              uri: lb://PROFILE-SERVICE
              predicates:
                - Path=/profile/**

            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/product/**

            - id: search-service
              uri: lb://SEARCH-SERVICE
              predicates:
                - Path=/search/**

            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/cart/**

            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/inventory/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/order/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payment/**

  # ===== REDIS (REQUIRED for RequestRateLimiter) =====
  data:
    redis:
      host: localhost
      port: 6379

  # ===== SECURITY (JWT RESOURCE SERVER) =====
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: my-super-secret-key-my-super-secret-key

# ===== EUREKA =====
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
