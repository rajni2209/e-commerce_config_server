server:
  port: 7070

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    ip-address: 127.0.0.1

spring:
  datasource:
    url: jdbc:mariadb://localhost:3307/ai_service
    username: root
    password: rajni

  ai:
    chat:
      client:
        enabled: true

    mcp:
      client:
        name: search-client
        streamable-http:
          connections:
            search-service:
              url: http://127.0.0.1:9099
              endpoint: /mcp

    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2:3b
      init:
        timeout: 5m

    retry:
      max-attempts: 1

    vectorstore:
      mariadb:
        initialize-schema: true
        distance-type: COSINE
        dimensions: 1536

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: ai-service-groups
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ecommerce.aiservice.kafka.ProductCreatedEventDTO
